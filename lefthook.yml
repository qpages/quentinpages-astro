pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,ts,mjs,astro}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{js,ts,mjs,astro,json,md,yml,yaml,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,astro}"
      run: pnpm check

pre-push:
  commands:
    verify:
      run: pnpm verify
